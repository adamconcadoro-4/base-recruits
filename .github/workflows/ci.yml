name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    # Migrations, the database security suite, the concurrency scenarios and the
    # TypeScript/database catalog contract, on plain PostgreSQL with Supabase's
    # roles and auth functions emulated (no Docker, no secrets). PostgreSQL 17 is
    # the version hosted Supabase runs.
    name: database (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    env:
      PG_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL ${{ matrix.postgres }}
        run: |
          if [ ! -x "${PG_BIN}/pg_ctl" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq "postgresql-${{ matrix.postgres }}"
          fi
          "${PG_BIN}/postgres" --version

      - name: Database security tests
        shell: bash
        run: |
          scripts/db/test.sh 2>&1 | tee "${RUNNER_TEMP}/db-tests.out"
          echo "::notice title=Database security tests (PostgreSQL ${{ matrix.postgres }})::$(grep -E '^Database tests:' "${RUNNER_TEMP}/db-tests.out")"

      - name: Database concurrency tests
        shell: bash
        run: |
          scripts/db/race-test.sh 2>&1 | tee "${RUNNER_TEMP}/race-tests.out"
          echo "::notice title=Concurrency tests (PostgreSQL ${{ matrix.postgres }})::$(grep -E '^Concurrency tests:' "${RUNNER_TEMP}/race-tests.out")"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dev tools
        run: npm install --no-audit --no-fund

      - name: Contract tests (TypeScript and database catalogs agree)
        shell: bash
        run: |
          npm run test:contract -- --reporter=default --reporter=json --outputFile="${RUNNER_TEMP}/contract.json"
          node scripts/ci/report-vitest.mjs "${RUNNER_TEMP}/contract.json" "Contract tests (PostgreSQL ${{ matrix.postgres }})" --no-skips
        env:
          PSQL: /usr/lib/postgresql/${{ matrix.postgres }}/bin/psql

  supabase:
    # The real Supabase stack (Auth, Data API, PostgreSQL 17) from the Supabase
    # CLI, with every migration applied exactly as `supabase db push` would, and
    # the database security suite run against it (no emulation).
    name: database on the real Supabase stack
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Choose the Supabase CLI version
        id: supabase-cli
        # Pinned (asking GitHub for "latest" hits its anonymous API rate limit).
        # Override with the SUPABASE_CLI_VERSION repository variable if needed.
        run: |
          version="${SUPABASE_CLI_VERSION:-2.121.0}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Supabase CLI::${version}"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Start Supabase with the migrations
        run: >-
          scripts/ci/run.sh "supabase start"
          supabase start -x realtime,storage-api,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Database security tests against the real stack
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          scripts/ci/run.sh "database tests on Supabase" scripts/db/test.sh | tee "${RUNNER_TEMP}/db-tests.out"
          echo "::notice title=Database security tests (real Supabase stack)::$(grep -E '^Database tests:' "${RUNNER_TEMP}/db-tests.out")"

  lockfile:
    # One-time: the build workspace cannot reach npm, so CI generates
    # package-lock.json and commits it to the pull request branch. Skipped once
    # the lockfile is committed; commits made with GITHUB_TOKEN do not re-trigger CI.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate and commit package-lock.json if missing
        run: |
          if [ -f package-lock.json ]; then
            echo "::notice title=Lockfile::package-lock.json is committed"
            exit 0
          fi
          npm install --package-lock-only --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated in CI"
          git push
          echo "::notice title=Lockfile::committed package-lock.json ($(wc -c < package-lock.json) bytes)"

  app:
    # Typecheck (app, tests and config) and unit tests. Fast feedback without
    # starting Supabase.
    name: typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dev tools
        run: npm install --no-audit --no-fund

      - name: Typecheck
        shell: bash
        run: |
          scripts/ci/run.sh "typecheck" npm run typecheck
          echo "::notice title=Typecheck::tsc $(npx tsc --version | cut -d' ' -f2): 0 errors in $(npx tsc --listFilesOnly | grep "^${GITHUB_WORKSPACE}/" | grep -vc '/node_modules/') project files"

      - name: Unit tests
        shell: bash
        run: |
          npm run test:unit -- --reporter=default --reporter=json --outputFile="${RUNNER_TEMP}/unit.json"
          node scripts/ci/report-vitest.mjs "${RUNNER_TEMP}/unit.json" "Unit tests (Vitest $(node -p "require('./node_modules/vitest/package.json').version"))" --no-skips

  e2e:
    # The production build against the real local Supabase stack: sign-up with
    # email confirmation, sign-in, role and verification gates, family consent,
    # and automated WCAG 2.2 AA checks at desktop and phone sizes.
    name: end-to-end and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Choose the Supabase CLI version
        id: supabase-cli
        # Pinned (asking GitHub for "latest" hits its anonymous API rate limit).
        # Override with the SUPABASE_CLI_VERSION repository variable if needed.
        run: |
          version="${SUPABASE_CLI_VERSION:-2.121.0}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Supabase CLI::${version}"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Start Supabase with the migrations
        run: >-
          scripts/ci/run.sh "supabase start"
          supabase start -x realtime,storage-api,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Use the local stack settings
        run: scripts/ci/supabase-env.sh >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: scripts/ci/run.sh "npm install" npm install --no-audit --no-fund

      - name: Install the Playwright browser
        run: scripts/ci/run.sh "playwright install" npx playwright install --with-deps chromium

      - name: Build
        run: scripts/ci/run.sh "next build" npm run build

      - name: End-to-end and accessibility tests
        run: scripts/ci/run.sh "playwright" npx playwright test

      - name: Report test counts
        if: always()
        run: node scripts/ci/report-playwright.mjs test-results/e2e.json "End-to-end and accessibility tests"
