# Supabase CLI configuration for LOCAL development and CI only (`supabase start`).
# Hosted projects are configured in the Supabase dashboard; see README.
# Rate limits are raised here so end-to-end tests can create many accounts.

project_id = "base-recruits"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

# Local email catcher (Mailpit). Confirmation emails land here, never in a real inbox.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Sign-up and sign-in use a 6-digit code typed into the site, never a link, so
# only the person who proves they own the inbox, in their own browser, can
# finish an account. Hosted projects need the same templates (see README).
[auth.email.template.confirmation]
subject = "Your Base Recruits code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.magic_link]
subject = "Your Base Recruits code"
content_path = "./supabase/templates/email-code.html"

# Every other Auth email is code-only too: a clickable recovery, email-change or
# invite link could otherwise confirm an account someone else pre-registered.
[auth.email.template.recovery]
subject = "Your Base Recruits code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.email_change]
subject = "Your Base Recruits code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.invite]
subject = "Your Base Recruits code"
content_path = "./supabase/templates/email-code.html"
